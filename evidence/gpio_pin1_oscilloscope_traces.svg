<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" style="background:#0f172a;font-family:Consolas,monospace;">
  <style>
    .title { fill: #f8fafc; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-size: 13px; }
    .label { fill: #e2e8f0; font-size: 13px; font-weight: bold; }
    .note { fill: #cbd5e1; font-size: 11px; }
    .axis { stroke: #475569; stroke-width: 1; stroke-dasharray: 4,4; }
    .grid { stroke: #1e293b; stroke-width: 1; }
    .trace-green { stroke: #22c55e; stroke-width: 3; fill: none; }
    .trace-red { stroke: #ef4444; stroke-width: 3; fill: none; }
    .trace-amber { stroke: #f59e0b; stroke-width: 3; fill: none; }
    .trace-cyan { stroke: #06b6d4; stroke-width: 3; fill: none; }
    .badge { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 4; }
  </style>

  <text x="30" y="35" class="title">ATSAMD21G18A (MKR Zero) — GPIO Pin 1 (PA23) Oscilloscope &amp; Scheduler Timing Traces</text>
  <text x="30" y="55" class="subtitle">Timebase: 500 ms / div | Logic HIGH = 3.3V (LED ON), Logic LOW = 0.0V (LED OFF)</text>

  <!-- Vertical Time Grid Lines (0ms to 3000ms, 130px per 500ms, starting at x=150) -->
  <g>
    <line x1="150" y1="75" x2="150" y2="575" class="axis"/>
    <line x1="280" y1="75" x2="280" y2="575" class="axis"/>
    <line x1="410" y1="75" x2="410" y2="575" class="axis"/>
    <line x1="540" y1="75" x2="540" y2="575" class="axis"/>
    <line x1="670" y1="75" x2="670" y2="575" class="axis"/>
    <line x1="800" y1="75" x2="800" y2="575" class="axis"/>
    <line x1="930" y1="75" x2="930" y2="575" class="axis"/>

    <text x="140" y="595" class="note">0.0s</text>
    <text x="265" y="595" class="note">0.5s</text>
    <text x="395" y="595" class="note">1.0s</text>
    <text x="525" y="595" class="note">1.5s</text>
    <text x="655" y="595" class="note">2.0s</text>
    <text x="785" y="595" class="note">2.5s</text>
    <text x="910" y="595" class="note">3.0s</text>
  </g>

  <!-- TRACE 1: CASE 0 - Same Priority (1,1,1) Run to Completion -->
  <text x="25" y="105" class="label" style="fill:#22c55e;">1. Same Priority</text>
  <text x="25" y="122" class="note">(Prio 1,1,1 | RTC)</text>
  <text x="115" y="100" class="note">3.3V</text>
  <text x="115" y="150" class="note">0.0V</text>
  <polyline class="trace-green" points="150,150 150,95 280,95 280,150 540,150 540,95 670,95 670,150 930,150"/>
  <text x="165" y="88" class="note" style="fill:#86efac;">T1 ON (500ms)</text>
  <text x="340" y="140" class="note" style="fill:#86efac;">T2 OFF (1000ms) + T3 UART</text>
  <text x="555" y="88" class="note" style="fill:#86efac;">T1 ON (500ms)</text>
  <text x="730" y="140" class="note" style="fill:#86efac;">T2 OFF (1000ms) + T3 UART</text>

  <!-- TRACE 2: CASE (a) - Task 1 Highest (3 > 2 > 1) Run to Completion -->
  <text x="25" y="230" class="label" style="fill:#ef4444;">2. Case (a): T1&gt;T2&gt;T3</text>
  <text x="25" y="247" class="note">(Prio 3,2,1 | RTC)</text>
  <text x="115" y="220" class="note">3.3V</text>
  <text x="115" y="270" class="note">0.0V</text>
  <polyline class="trace-red" points="150,270 150,215 930,215"/>
  <text x="260" y="207" class="note" style="fill:#fca5a5;">Pin 1 STUCK HIGH (3.3V) — T1 (Prio 3) active-waits &amp; taskYIELD() only yields to Prio &gt;= 3; T2 &amp; T3 STARVED!</text>

  <!-- TRACE 3: CASE (b) - No Priority Inheritance (Binary Semaphore) -->
  <text x="25" y="355" class="label" style="fill:#f59e0b;">3. Case (b): No Inh.</text>
  <text x="25" y="372" class="note">(Binary Semaphore)</text>
  <text x="115" y="345" class="note">3.3V</text>
  <text x="115" y="395" class="note">0.0V</text>
  <polyline class="trace-amber" points="150,395 150,340 295,340 295,395 555,395 555,340 700,340 700,395 930,395"/>
  <text x="155" y="332" class="note" style="fill:#fcd34d;">T1 (EffPrio=1) Preempted by T3 (Prio=2) -> Priority Inversion delays High-Prio T2!</text>

  <!-- TRACE 4: CASE (c) - Priority Inheritance Enabled (FreeRTOS Mutex) -->
  <text x="25" y="485" class="label" style="fill:#06b6d4;">4. Case (c): Prio Inh.</text>
  <text x="25" y="502" class="note">(FreeRTOS Mutex)</text>
  <text x="115" y="475" class="note">3.3V</text>
  <text x="115" y="525" class="note">0.0V</text>
  <polyline class="trace-cyan" points="150,525 150,470 280,470 280,525 540,525 540,470 670,470 670,525 930,525"/>
  <text x="155" y="462" class="note" style="fill:#67e8f9;">T1 Boosted (EffPrio 1-&gt;3) while holding Mutex -> Blocks T3 preemption; exact 500ms ON / 1000ms OFF!</text>
</svg>
